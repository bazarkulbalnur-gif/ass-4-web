<main>
<h1>Events</h1>
<p class="sub">Mouse, keyboard and a calculator</p>

<section class="card">
  <h2>Task 5. Mouse Events</h2>
  <div id="hoverBox">Hover over me 🫧</div>
</section>
<section class="card">
  <h2>Task 6. Keyboard Events</h2>
  <input id="typeInput" type="text" placeholder="Start typing...">
  <p class="out" id="typeOut">You typed: </p>
</section>
<section class="card">
  <h2>Task 7. Calculator</h2>
  <div class="row">
    <input id="num1" type="number" placeholder="First number">
    <input id="num2" type="number" placeholder="Second number">
  </div>
  <div class="row">
    <button data-op="+">+</button><button data-op="-">−</button>
    <button data-op="*">×</button><button data-op="/">÷</button>
  </div>
  <div class="out" id="calcOut">Result: </div>
</section>
</main>
